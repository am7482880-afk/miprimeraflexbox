<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi primer maqueta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .icono-nav {
            width: 28px;
            height: 28px;
            margin-right: 6px;
            vertical-align: middle;
        }

        .seccion-img {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .ilustracion {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .caja1 {
            min-height: 100px;
            background-color: #FFDC5B;
        }

        .caja2 {
            height: 300px;
            background-color: #FFCA5B;
        }

        .caja3 {
            height: 300px;
            background-color: #FFB75B;
        }

        .caja4 {
            height: 300px;
            background-color: #FF9E5B;
        }

        .caja5 {
            height: 300px;
            background-color: #FF845B;
        }

        .caja6 {
            height: 300px;
            background-color: #FF6B5B;
        }

        .caja7 {
            height: 300px;
            background-color: #FF525B;
        }

        .caja8 {
            height: 300px;
            background-color: #FF385B;
        }

        .caja9 {
            height: 300px;
            background-color: #E62253;
        }

        .caja10 {
            height: 300px;
            background-color: #C90E4B;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <nav
                class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12 caja1 d-flex flex-wrap gap-2 p-4 justify-content-center">

                <a href="#" class="btn btn-outline-dark" role="button">
                    <img src="img/icono-estructura.svg" alt="" class="icono-nav">
                    Estructura y sintaxis
                </a>
                <a href="#" class="btn btn-outline-dark" role="button">
                    <img src="img/icono-especificidad.svg" alt="" class="icono-nav">
                    Niveles de especificidad
                </a>
                <a href="#" class="btn btn-outline-dark" role="button">
                    <img src="img/icono-pseudoclases.svg" alt="" class="icono-nav">
                    Pseudoclases y elementos
                </a>
                <a href="#" class="btn btn-outline-dark" role="button">
                    <img src="img/icono-boxmodel.svg" alt="" class="icono-nav">
                    Box model
                </a>

            </nav>
            <header class="col-12 col-sm-12 col-md-10 col-lg-10 col-xl-12 col-xxl-12 caja2">caja 2</header>
            <aside class="col-6 col-sm-6 col-md-2 col-lg-2 col-xl-4 col-xxl-4 caja3">caja 3</aside>
            <section class="col-6 col-sm-6 col-md-2 col-lg-2 col-xl-4 col-xxl-4 caja4 seccion-img">
                <img src="img/css-facil-degradado.svg" alt="CSS fácil: fondos con degradado" class="ilustracion">
            </section>
            <aside class="col-6 col-sm-6 col-md-10 col-lg-10 col-xl-4 col-xxl-4 caja5">caja 5</aside>
            <section class="col-6 col-sm-6 col-md-12 col-lg-12 col-xl-3 col-xxl-3 caja6 seccion-img">
                <img src="img/css-facil-margen-relleno.svg" alt="CSS fácil: margin y padding" class="ilustracion">
            </section>
            <section class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-2 col-xxl-2 caja7 seccion-img">
                <img src="img/css-facil-hover.svg" alt="CSS fácil: reacciona con :hover" class="ilustracion">
            </section>
            <section class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-7 col-xxl-7 caja8 seccion-img">
                <img src="img/css-facil-grid.svg" alt="CSS fácil: cuadrículas con grid" class="ilustracion">
            </section>
            <section class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-5 col-xxl-5 caja9 seccion-img">
                <img src="img/css-facil-fuentes.svg" alt="CSS fácil: elige tu tipografía" class="ilustracion">
            </section>
            <footer class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-5 col-xxl-5 caja10">caja 10</footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
